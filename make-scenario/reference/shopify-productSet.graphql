# Shopify Admin GraphQL — one-call product create
#
# Endpoint: https://YOUR-STORE.myshopify.com/admin/api/2025-01/graphql.json
# Header:   X-Shopify-Access-Token: shpat_xxx
#
# productSet creates (or updates) a product WITH its variant(s), media (image),
# metafields and SEO in a SINGLE synchronous call. This replaces the old
# create-product -> create-variant -> upload-image -> create-metafield chain.
#
# Send as the HTTP body: {"query": "<this mutation, minified>", "variables": { ... }}
# See shopify-body.example.json for the variables + Make field mappings.

mutation CreateProduct($input: ProductSetInput!) {
  productSet(input: $input, synchronous: true) {
    product {
      id
      handle
      title
      status
      onlineStorePreviewUrl
      variants(first: 5) {
        nodes { id title price }
      }
      media(first: 10) {
        nodes {
          id
          status
          mediaContentType
          ... on MediaImage { image { url } }
        }
      }
      metafields(first: 25) {
        nodes { namespace key value type }
      }
    }
    userErrors { field message }
  }
}
